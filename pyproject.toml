[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cerev-mcp"
version = "0.1.0"
description = "CEREV Model Context Protocol (MCP) server for enterprise evidence integrity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
cerev = "cerev_mcp.server:main"
cerev-mcp = "cerev_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
include = ["cerev_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
