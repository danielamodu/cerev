[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cerev"
version = "0.1.0"
description = "A pre-execution evidence integrity layer for autonomous agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["cryptography>=44.0"]

[project.scripts]
cerev-protected-demo = "cerev.demo:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.setuptools.packages.find]
include = ["cerev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

